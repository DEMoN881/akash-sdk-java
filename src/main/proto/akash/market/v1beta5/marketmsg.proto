syntax = "proto3";
package akash.market.v1beta5;
option java_package = "akash.market.v1beta5";
option java_multiple_files = true;

import "cosmos/base/v1beta1/coin.proto";
import "akash/base/deposit/v1/deposit.proto";

// Wire-compatible with chain-sdk market/v1 and market/v1beta5.
// Akash node v2.2 registers these messages, not v1beta4.

message OrderID {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
}

message BidID {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
  string provider = 5;
  uint32 bseq = 6;
}

message LeaseID {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
  string provider = 5;
  uint32 bseq = 6;
}

message MsgCreateBid {
  BidID id = 1;
  cosmos.base.v1beta1.DecCoin price = 2;
  akash.base.deposit.v1.Deposit deposit = 3;
}

message MsgCloseBid {
  BidID id = 1;
}

message MsgCreateLease {
  BidID bid_id = 1;
}

message MsgWithdrawLease {
  LeaseID id = 1;
}

message MsgCloseLease {
  LeaseID id = 1;
}

message MsgCreateBidResponse {}
message MsgCloseBidResponse {}
message MsgCreateLeaseResponse {}
message MsgWithdrawLeaseResponse {}
message MsgCloseLeaseResponse {}
