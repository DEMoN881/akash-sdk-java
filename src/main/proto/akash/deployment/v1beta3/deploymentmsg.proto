syntax = "proto3";
package akash.deployment.v1beta3;
option java_package = "akash.deployment.v1beta3";
option java_multiple_files = true;

import "cosmos/base/v1beta1/coin.proto";

message DeploymentID {
  string owner = 1;
  uint64 dseq = 2;
}

message GroupID {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
}

message MsgCreateDeployment {
  DeploymentID id = 1;
  repeated GroupSpec groups = 2;
  bytes version = 3;
  cosmos.base.v1beta1.Coin deposit = 4;
  string depositor = 5;
}

message MsgUpdateDeployment {
  DeploymentID id = 1;
  bytes version = 2;
}

message MsgCloseDeployment {
  DeploymentID id = 1;
}

message MsgDepositDeployment {
  DeploymentID id = 1;
  cosmos.base.v1beta1.Coin amount = 2;
  string depositor = 3;
}

message MsgCloseGroup {
  GroupID id = 1;
}

message MsgPauseGroup {
  GroupID id = 1;
}

message MsgStartGroup {
  GroupID id = 1;
}

message GroupSpec {
  string name = 1;
  // simplified: full spec has resources[], requirements, etc.
}

message MsgCreateDeploymentResponse {}
message MsgUpdateDeploymentResponse {}
message MsgCloseDeploymentResponse {}
message MsgDepositDeploymentResponse {}
message MsgCloseGroupResponse {}
message MsgPauseGroupResponse {}
message MsgStartGroupResponse {}
