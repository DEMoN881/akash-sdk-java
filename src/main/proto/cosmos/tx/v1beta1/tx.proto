syntax = "proto3";
package cosmos.tx.v1beta1;
option java_package = "cosmos.tx.v1beta1";
option java_outer_classname = "TxOuterClass";
option java_multiple_files = false;

import "google/protobuf/any.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/tx/signing/v1beta1/signing.proto";

message Tx {
  TxBody body = 1;
  AuthInfo auth_info = 2;
  repeated bytes signatures = 3;
}

message TxRaw {
  bytes body_bytes = 1;
  bytes auth_info_bytes = 2;
  repeated bytes signatures = 3;
}

message SignDoc {
  bytes body_bytes = 1;
  bytes auth_info_bytes = 2;
  string chain_id = 3;
  uint64 account_number = 4;
}

message TxBody {
  repeated google.protobuf.Any messages = 1;
  string memo = 2;
  uint64 timeout_height = 3;
  repeated google.protobuf.Any extension_options = 1023;
  repeated google.protobuf.Any non_critical_extension_options = 2047;
}

message AuthInfo {
  repeated SignerInfo signer_infos = 1;
  Fee fee = 2;
  Tip tip = 3;
}

message SignerInfo {
  google.protobuf.Any public_key = 1;
  ModeInfo mode_info = 2;
  uint64 sequence = 3;
}

message ModeInfo {
  oneof sum {
    Single single = 1;
    Multi multi = 2;
  }

  message Single {
    cosmos.tx.signing.v1beta1.SignMode mode = 1;
  }

  message Multi {
    CompactBitArray bitarray = 1;
    repeated ModeInfo mode_infos = 2;
  }
}

message Fee {
  repeated cosmos.base.v1beta1.Coin amount = 1;
  uint64 gas_limit = 2;
  string payer = 3;
  string granter = 4;
}

message Tip {
  repeated cosmos.base.v1beta1.Coin amount = 1;
  string tipper = 2;
}

message CompactBitArray {
  uint32 extra_bits_stored = 1;
  bytes elems = 2;
}

// Broadcast request/response for REST
message BroadcastTxRequest {
  bytes tx_bytes = 1;
  BroadcastMode mode = 2;
}

enum BroadcastMode {
  BROADCAST_MODE_UNSPECIFIED = 0;
  BROADCAST_MODE_BLOCK = 1;
  BROADCAST_MODE_SYNC = 2;
  BROADCAST_MODE_ASYNC = 3;
}

message BroadcastTxResponse {
  TxResponse tx_response = 1;
}

message TxResponse {
  int64 height = 1;
  string txhash = 2;
  string codespace = 3;
  uint32 code = 4;
  string data = 5;
  string raw_log = 6;
  string info = 8;
  int64 gas_wanted = 9;
  int64 gas_used = 10;
  string timestamp = 12;
}
