syntax = "proto3";
package akash.provider.v1beta4;
option java_package = "akash.provider.v1beta4";
option java_multiple_files = true;

import "akash/base/v1beta1/attribute.proto";

message Info {
  string email = 1;
  string website = 2;
}

message Provider {
  string owner = 1;
  string host_uri = 2;
  repeated akash.base.v1beta1.Attribute attributes = 3;
  Info info = 4;
}

message MsgCreateProvider {
  string owner = 1;
  string host_uri = 2;
  repeated akash.base.v1beta1.Attribute attributes = 3;
  Info info = 4;
}

message MsgUpdateProvider {
  string owner = 1;
  string host_uri = 2;
  repeated akash.base.v1beta1.Attribute attributes = 3;
  Info info = 4;
}

message MsgDeleteProvider {
  string owner = 1;
}

message MsgCreateProviderResponse {}
message MsgUpdateProviderResponse {}
message MsgDeleteProviderResponse {}
