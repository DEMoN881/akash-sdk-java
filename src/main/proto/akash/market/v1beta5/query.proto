syntax = "proto3";
package akash.market.v1beta5;
option java_package = "akash.market.v1beta5";
option java_multiple_files = true;

import "cosmos/base/v1beta1/coin.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "akash/market/v1beta5/marketmsg.proto";

message Order {
  OrderID order_id = 1;
  int32 state = 2;
  int64 created_at = 3;
}

message Bid {
  BidID id = 1;
  int32 state = 2;
  cosmos.base.v1beta1.DecCoin price = 3;
  int64 created_at = 4;
}

message Lease {
  LeaseID id = 1;
  int32 state = 2;
  cosmos.base.v1beta1.DecCoin price = 3;
  int64 created_at = 4;
}

message QueryOrderRequest {
  OrderID id = 1;
}
message QueryOrderResponse {
  Order order = 1;
}

message OrderFilters {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
  string state = 5;
}
message QueryOrdersRequest {
  OrderFilters filters = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryOrdersResponse {
  repeated Order orders = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryBidRequest {
  BidID id = 1;
}
message QueryBidResponse {
  Bid bid = 1;
}

message BidFilters {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
  string provider = 5;
  string state = 6;
  uint32 bseq = 7;
}
message QueryBidsRequest {
  BidFilters filters = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryBidsResponse {
  repeated QueryBidResponse bids = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryLeaseRequest {
  LeaseID id = 1;
}
message QueryLeaseResponse {
  Lease lease = 1;
}

message LeaseFilters {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
  string provider = 5;
  string state = 6;
}
message QueryLeasesRequest {
  LeaseFilters filters = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryLeasesResponse {
  repeated QueryLeaseResponse leases = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

service Query {
  rpc Order(QueryOrderRequest) returns (QueryOrderResponse);
  rpc Orders(QueryOrdersRequest) returns (QueryOrdersResponse);
  rpc Bid(QueryBidRequest) returns (QueryBidResponse);
  rpc Bids(QueryBidsRequest) returns (QueryBidsResponse);
  rpc Lease(QueryLeaseRequest) returns (QueryLeaseResponse);
  rpc Leases(QueryLeasesRequest) returns (QueryLeasesResponse);
}
