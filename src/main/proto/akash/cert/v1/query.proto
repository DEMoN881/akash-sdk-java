syntax = "proto3";
package akash.cert.v1;
option java_package = "akash.cert.v1";
option java_multiple_files = true;

import "cosmos/base/query/v1beta1/pagination.proto";

enum State {
  invalid = 0;
  valid = 1;
  revoked = 2;
}

message Certificate {
  State state = 2;
  bytes cert = 3;
  bytes pubkey = 4;
}

message CertificateResponse {
  Certificate certificate = 1;
  string serial = 2;
}

message CertificateFilter {
  string owner = 1;
  string serial = 2;
  string state = 3;
}

message QueryCertificatesRequest {
  CertificateFilter filter = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryCertificatesResponse {
  repeated CertificateResponse certificates = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

service Query {
  rpc Certificates(QueryCertificatesRequest) returns (QueryCertificatesResponse);
}
