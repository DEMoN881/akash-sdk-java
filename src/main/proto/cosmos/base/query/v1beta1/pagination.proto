syntax = "proto3";
package cosmos.base.query.v1beta1;
option java_package = "cosmos.base.query.v1beta1";
option java_multiple_files = true;

message PageRequest {
  bytes key = 1;
  uint64 offset = 2;
  uint64 limit = 3;
  bool count_total = 4;
  bool reverse = 5;
}

message PageResponse {
  bytes next_key = 1;
  uint64 total = 2;
}
