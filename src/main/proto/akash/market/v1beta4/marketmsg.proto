syntax = "proto3";
package akash.market.v1beta4;
option java_package = "akash.market.v1beta4";
option java_multiple_files = true;

import "cosmos/base/v1beta1/coin.proto";

message OrderID {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
}

message BidID {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
  string provider = 5;
}

message LeaseID {
  string owner = 1;
  uint64 dseq = 2;
  uint32 gseq = 3;
  uint32 oseq = 4;
  string provider = 5;
}

message MsgCreateBid {
  OrderID order = 1;
  string provider = 2;
  cosmos.base.v1beta1.DecCoin price = 3;
  cosmos.base.v1beta1.Coin deposit = 4;
}

message MsgCloseBid {
  BidID bid_id = 1;
}

message MsgCreateLease {
  BidID bid_id = 1;
}

message MsgWithdrawLease {
  LeaseID lease_id = 1;
}

message MsgCloseLease {
  LeaseID lease_id = 1;
}

message MsgCreateBidResponse {}
message MsgCloseBidResponse {}
message MsgCreateLeaseResponse {}
message MsgWithdrawLeaseResponse {}
message MsgCloseLeaseResponse {}
